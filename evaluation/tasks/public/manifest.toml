schema_version = "evaluation-manifest-v1"
manifest_id = "public-p0"

# Twelve self-authored, redistributable tasks: the four P0 tasks plus the expansion to
# the full set of design section 18.4, three tasks per category.
# Every path is relative to this file, stays inside this directory, and lives outside the
# read-only baseline so that gold overlays and oracles never reach the agent workspace.
#
# Each task pins what it ships: `baseline_tree_hash` is the sha256 over the canonical JSON of
# the baseline's path-to-content-hash mapping (ignoring `__pycache__`, `.git`, `.DS_Store` and
# `*.pyc`), and each oracle hash is the sha256 of that oracle file's bytes. `coding-agent-eval
# validate` recomputes all three and refuses the manifest on any mismatch, so a baseline or an
# oracle cannot be edited between campaigns without invalidating this file.

[[tasks]]
task_id = "new-file-slugify"
category = "new_file"
prompt = "new-file-slugify/prompt.md"
baseline = "new-file-slugify/baseline"
baseline_tree_hash = "7b43c81858e4e878f765d843fdff5d24d3770161422d02efe67c92d4475f5f89"
gold_overlay = "new-file-slugify/gold"
error_overlay = "new-file-slugify/error"
target_oracle = "new-file-slugify/oracle/target.py"
target_oracle_hash = "c948f14bb53daa1a9bef53fcc4c635c734db538062b1b8bb48fbd49f0d822f60"
regression_oracle = "new-file-slugify/oracle/regression.py"
regression_oracle_hash = "9b96a737ade800562a82da7479540cf46c539922cddb2f906916824a1117cd1f"
allowed_paths = ["src/textkit"]
forbidden_paths = ["tests", "README.md"]
timeout_seconds = 900
commands = [
    { command = "PYTHONPATH=src python3 -B -m unittest discover -s tests -t tests", cwd = "." },
]

